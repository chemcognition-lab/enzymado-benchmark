<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enzymado leaderboard</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-linear:  #2a78d6;
    --series-mlp:     #eb6834;
    --series-xgboost: #1baf7a;
    --hover-wash:     rgba(11,11,11,0.045);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-linear:  #3987e5;
      --series-mlp:     #d95926;
      --series-xgboost: #199e70;
      --hover-wash:     rgba(255,255,255,0.06);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-linear:  #3987e5;
    --series-mlp:     #d95926;
    --series-xgboost: #199e70;
    --hover-wash:     rgba(255,255,255,0.06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
  }
  .viz-root { max-width: 1080px; margin: 0 auto; padding: 40px 20px 64px; }

  header.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  header.page-head h1 { font-size: 21px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  header.page-head p { margin: 0; color: var(--text-secondary); font-size: 13px; max-width: 60ch; line-height: 1.5; }

  .icon-btn {
    display: flex; align-items: center; justify-content: center; flex: none;
    width: 34px; height: 34px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    cursor: pointer; transition: background 120ms ease;
  }
  .icon-btn:hover { background: var(--hover-wash); }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn .icon-moon { display: none; }
  :root[data-theme="dark"] .icon-btn .icon-sun,
  :root:not([data-theme="light"]) .icon-btn .icon-sun { display: none; }
  :root[data-theme="dark"] .icon-btn .icon-moon,
  :root:not([data-theme="light"]) .icon-btn .icon-moon { display: block; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .icon-btn .icon-sun { display: block; }
    :root:not([data-theme="dark"]) .icon-btn .icon-moon { display: none; }
  }

  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 20px; }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .filter-group label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .filter-group select {
    font: inherit; font-size: 13px; color: var(--text-primary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; min-width: 120px; cursor: pointer;
  }
  .filter-group select:hover { background: var(--hover-wash); }

  figure.chart-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px 12px; margin: 0;
  }
  .chart-title-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 2px; }
  .chart-title-row h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .chart-subtitle { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 12px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }

  .legend { display: flex; gap: 8px; flex-wrap: wrap; }
  .legend-chip {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font: inherit; font-size: 12px; color: var(--text-secondary);
    background: transparent; border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 10px 4px 8px; transition: background 120ms ease, opacity 120ms ease;
  }
  .legend-chip:hover { background: var(--hover-wash); }
  .legend-chip[aria-pressed="true"] { background: color-mix(in srgb, var(--chip-color) 14%, transparent); border-color: color-mix(in srgb, var(--chip-color) 40%, var(--border)); }
  .legend-chip[aria-pressed="false"] { opacity: 0.45; }
  .legend-chip .swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; background: var(--chip-color); }

  .seg-toggle { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--page); border: 1px solid var(--border); }
  .seg-toggle button {
    font: inherit; font-size: 12px; color: var(--text-secondary); background: transparent;
    border: none; border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .seg-toggle button[aria-pressed="true"] { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 1px 2px var(--border); }

  .export-group { display: flex; gap: 6px; }
  .export-group button {
    display: flex; align-items: center; gap: 6px;
    font: inherit; font-size: 12px; color: var(--text-secondary); background: var(--page);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .export-group button:hover:not(:disabled) { background: var(--hover-wash); color: var(--text-primary); }
  .export-group button:disabled { opacity: 0.4; cursor: not-allowed; }
  .export-group svg { width: 12px; height: 12px; }

  .chart-wrap { position: relative; }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; border-radius: 8px; }
  svg.chart .bar { cursor: pointer; }
  svg.chart .bar:hover, svg.chart .bar:focus { filter: brightness(1.08); outline: none; }

  .tooltip {
    position: absolute; pointer-events: none; z-index: 5; max-width: 220px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    opacity: 0; transition: opacity 80ms ease; transform: translate(-50%, -100%);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .tt-value { font-size: 14px; font-weight: 700; color: var(--text-primary); }
  .tooltip .tt-meta { color: var(--text-secondary); }
  .tooltip .tt-key { display: inline-block; width: 8px; height: 2px; margin-right: 5px; vertical-align: middle; }

  table.leaderboard-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0 10px; }
  table.leaderboard-table caption { text-align: left; color: var(--text-secondary); font-size: 11px; margin-bottom: 6px; }
  table.leaderboard-table th, table.leaderboard-table td {
    text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  table.leaderboard-table th:first-child, table.leaderboard-table td:first-child,
  table.leaderboard-table th:nth-child(2), table.leaderboard-table td:nth-child(2) { text-align: left; }
  table.leaderboard-table thead th { color: var(--text-muted); font-weight: 500; font-size: 11px; }
  table.leaderboard-table tbody tr:hover { background: var(--hover-wash); }

  .empty-state { color: var(--text-muted); font-size: 13px; padding: 28px 0; text-align: center; }
  footer.notes { color: var(--text-muted); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<div class="viz-root">
  <header class="page-head">
    <div>
      <h1>Enzymado leaderboard</h1>
      <p>Test-set primary metric per foundation-model embedding, from <code>results_card.json</code>. Bars are grouped by model family; ranking uses the mean of whichever families ran for that embedding.</p>
    </div>
    <button id="theme-toggle" class="icon-btn" type="button" aria-pressed="false" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </header>

  <div class="filter-row">
    <div class="filter-group">
      <label for="task-select">Task</label>
      <select id="task-select"></select>
    </div>
    <div class="filter-group">
      <label for="split-select">Split</label>
      <select id="split-select"></select>
    </div>
    <div class="filter-group">
      <label for="mode-select">Pooling</label>
      <select id="mode-select"></select>
    </div>
  </div>

  <figure class="chart-card">
    <div class="chart-title-row">
      <h2 id="chart-title">&nbsp;</h2>
    </div>
    <p class="chart-subtitle" id="chart-subtitle">&nbsp;</p>

    <div class="toolbar">
      <div class="legend" id="legend"></div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="seg-toggle">
          <button id="view-chart" type="button" aria-pressed="true">Chart</button>
          <button id="view-table" type="button" aria-pressed="false">Table</button>
        </div>
        <div class="export-group">
          <button id="export-svg" type="button" title="Export current chart as SVG">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
            SVG
          </button>
          <button id="export-png" type="button" title="Export current chart as PNG">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
            PNG
          </button>
        </div>
      </div>
    </div>

    <div class="chart-wrap" id="chart-wrap">
      <svg class="chart" id="chart"></svg>
      <div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>
      <div class="empty-state" id="empty-state" hidden>No completed runs for this task / split / pooling combination.</div>
    </div>
    <div id="table-wrap" hidden></div>
    <footer class="notes" id="chart-notes"></footer>
  </figure>
</div>

<script id="leaderboard-data" type="application/json">__LEADERBOARD_DATA__</script>
<script src="leaderboard_charts.js"></script>
<script src="leaderboard_app.js"></script>
<script>
  LeaderboardApp.init(JSON.parse(document.getElementById("leaderboard-data").textContent));
</script>
</body>
</html>
