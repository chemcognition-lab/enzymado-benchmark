<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enzymado leaderboard</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-linear:  #2a78d6;
    --series-mlp:     #eb6834;
    --series-xgboost: #1baf7a;
    --hover-wash:     rgba(11,11,11,0.045);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-linear:  #3987e5;
      --series-mlp:     #d95926;
      --series-xgboost: #199e70;
      --hover-wash:     rgba(255,255,255,0.06);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-linear:  #3987e5;
    --series-mlp:     #d95926;
    --series-xgboost: #199e70;
    --hover-wash:     rgba(255,255,255,0.06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
  }
  .viz-root { max-width: 1080px; margin: 0 auto; padding: 40px 20px 64px; }

  header.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  header.page-head h1 { font-size: 21px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  header.page-head p { margin: 0; color: var(--text-secondary); font-size: 13px; max-width: 60ch; line-height: 1.5; }

  .icon-btn {
    display: flex; align-items: center; justify-content: center; flex: none;
    width: 34px; height: 34px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    cursor: pointer; transition: background 120ms ease;
  }
  .icon-btn:hover { background: var(--hover-wash); }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn .icon-moon { display: none; }
  :root[data-theme="dark"] .icon-btn .icon-sun,
  :root:not([data-theme="light"]) .icon-btn .icon-sun { display: none; }
  :root[data-theme="dark"] .icon-btn .icon-moon,
  :root:not([data-theme="light"]) .icon-btn .icon-moon { display: block; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .icon-btn .icon-sun { display: block; }
    :root:not([data-theme="dark"]) .icon-btn .icon-moon { display: none; }
  }

  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 20px; }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .filter-group label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .filter-group select {
    font: inherit; font-size: 13px; color: var(--text-primary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; min-width: 120px; cursor: pointer;
  }
  .filter-group select:hover { background: var(--hover-wash); }

  figure.chart-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px 12px; margin: 0;
  }
  .chart-title-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 2px; }
  .chart-title-row h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .chart-subtitle { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 12px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }

  .legend { display: flex; gap: 8px; flex-wrap: wrap; }
  .legend-chip {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font: inherit; font-size: 12px; color: var(--text-secondary);
    background: transparent; border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 10px 4px 8px; transition: background 120ms ease, opacity 120ms ease;
  }
  .legend-chip:hover { background: var(--hover-wash); }
  .legend-chip[aria-pressed="true"] { background: color-mix(in srgb, var(--chip-color) 14%, transparent); border-color: color-mix(in srgb, var(--chip-color) 40%, var(--border)); }
  .legend-chip[aria-pressed="false"] { opacity: 0.45; }
  .legend-chip .swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; background: var(--chip-color); }

  .seg-toggle { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--page); border: 1px solid var(--border); }
  .seg-toggle button {
    font: inherit; font-size: 12px; color: var(--text-secondary); background: transparent;
    border: none; border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .seg-toggle button[aria-pressed="true"] { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 1px 2px var(--border); }

  .export-group { display: flex; gap: 6px; }
  .export-group button {
    display: flex; align-items: center; gap: 6px;
    font: inherit; font-size: 12px; color: var(--text-secondary); background: var(--page);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .export-group button:hover:not(:disabled) { background: var(--hover-wash); color: var(--text-primary); }
  .export-group button:disabled { opacity: 0.4; cursor: not-allowed; }
  .export-group svg { width: 12px; height: 12px; }

  .chart-wrap { position: relative; }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; border-radius: 8px; }
  svg.chart .bar { cursor: pointer; }
  svg.chart .bar:hover, svg.chart .bar:focus { filter: brightness(1.08); outline: none; }

  .tooltip {
    position: absolute; pointer-events: none; z-index: 5; max-width: 220px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    opacity: 0; transition: opacity 80ms ease; transform: translate(-50%, -100%);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .tt-value { font-size: 14px; font-weight: 700; color: var(--text-primary); }
  .tooltip .tt-meta { color: var(--text-secondary); }
  .tooltip .tt-key { display: inline-block; width: 8px; height: 2px; margin-right: 5px; vertical-align: middle; }

  table.leaderboard-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0 10px; }
  table.leaderboard-table caption { text-align: left; color: var(--text-secondary); font-size: 11px; margin-bottom: 6px; }
  table.leaderboard-table th, table.leaderboard-table td {
    text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  table.leaderboard-table th:first-child, table.leaderboard-table td:first-child,
  table.leaderboard-table th:nth-child(2), table.leaderboard-table td:nth-child(2) { text-align: left; }
  table.leaderboard-table thead th { color: var(--text-muted); font-weight: 500; font-size: 11px; }
  table.leaderboard-table tbody tr:hover { background: var(--hover-wash); }

  .empty-state { color: var(--text-muted); font-size: 13px; padding: 28px 0; text-align: center; }
  footer.notes { color: var(--text-muted); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<div class="viz-root">
  <header class="page-head">
    <div>
      <h1>Enzymado leaderboard</h1>
      <p>Test-set primary metric per foundation-model embedding, from <code>results_card.json</code>. Bars are grouped by model family; ranking uses the mean of whichever families ran for that embedding.</p>
    </div>
    <button id="theme-toggle" class="icon-btn" type="button" aria-pressed="false" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </header>

  <div class="filter-row">
    <div class="filter-group">
      <label for="task-select">Task</label>
      <select id="task-select"></select>
    </div>
    <div class="filter-group">
      <label for="split-select">Split</label>
      <select id="split-select"></select>
    </div>
    <div class="filter-group">
      <label for="mode-select">Pooling</label>
      <select id="mode-select"></select>
    </div>
  </div>

  <figure class="chart-card">
    <div class="chart-title-row">
      <h2 id="chart-title">&nbsp;</h2>
    </div>
    <p class="chart-subtitle" id="chart-subtitle">&nbsp;</p>

    <div class="toolbar">
      <div class="legend" id="legend"></div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="seg-toggle">
          <button id="view-chart" type="button" aria-pressed="true">Chart</button>
          <button id="view-table" type="button" aria-pressed="false">Table</button>
        </div>
        <div class="export-group">
          <button id="export-svg" type="button" title="Export current chart as SVG">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
            SVG
          </button>
          <button id="export-png" type="button" title="Export current chart as PNG">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
            PNG
          </button>
        </div>
      </div>
    </div>

    <div class="chart-wrap" id="chart-wrap">
      <svg class="chart" id="chart"></svg>
      <div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>
      <div class="empty-state" id="empty-state" hidden>No completed runs for this task / split / pooling combination.</div>
    </div>
    <div id="table-wrap" hidden></div>
    <footer class="notes" id="chart-notes"></footer>
  </figure>
</div>

<script>
/**
 * LeaderboardCharts — stateless rendering primitives for the leaderboard chart.
 *
 * Nothing in this file reads or writes app state (filters, active families,
 * current view). Every function takes its inputs as arguments and draws into
 * the DOM node it's given, so it can be unit-exercised or reused by a
 * different app shell without change. leaderboard_app.js owns the state and
 * calls into these.
 */
(function (global) {
  "use strict";

  var SVGNS = "http://www.w3.org/2000/svg";
  var FONT_FAMILY = "system-ui, -apple-system, 'Segoe UI', sans-serif";

  // ---- theme -----------------------------------------------------------
  //
  // Colors are resolved to concrete values (not `var(--x)` references) once
  // per render, from whichever CSS custom properties are active on `el` at
  // that moment (light/dark). Every mark is then drawn with a plain hex/rgb
  // attribute. That's what makes the chart's own SVG markup exportable as a
  // standalone file: it never depends on the page's stylesheet to render
  // correctly, so an exported .svg (or a PNG rasterized from it) looks
  // identical outside this page.

  function resolveTheme(el) {
    var cs = getComputedStyle(el);
    function v(name) {
      return cs.getPropertyValue(name).trim();
    }
    return {
      surface: v("--surface-1"),
      textPrimary: v("--text-primary"),
      textSecondary: v("--text-secondary"),
      textMuted: v("--text-muted"),
      gridline: v("--gridline"),
      baseline: v("--baseline"),
      border: v("--border"),
      hoverWash: v("--hover-wash"),
      families: {
        linear: v("--series-linear"),
        mlp: v("--series-mlp"),
        xgboost: v("--series-xgboost"),
      },
    };
  }

  function formatValue(value) {
    return Math.abs(value) >= 100 ? value.toFixed(0) : value.toFixed(3);
  }

  // ---- legend ------------------------------------------------------------

  function renderLegend(container, opts) {
    var families = opts.families;
    var activeFamilies = opts.activeFamilies;
    var familyLabel = opts.familyLabel;
    var theme = opts.theme;
    var onToggle = opts.onToggle;

    container.innerHTML = "";
    families.forEach(function (family) {
      var isActive = !!activeFamilies[family];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "legend-chip";
      btn.setAttribute("aria-pressed", String(isActive));
      btn.style.setProperty("--chip-color", theme.families[family]);

      var swatch = document.createElement("span");
      swatch.className = "swatch";
      btn.appendChild(swatch);

      var label = document.createElement("span");
      label.textContent = familyLabel[family] || family;
      btn.appendChild(label);

      btn.addEventListener("click", function () {
        onToggle(family);
      });
      container.appendChild(btn);
    });
  }

  // ---- bar chart -----------------------------------------------------------

  function roundedBarPath(x, y, w, h, r, roundTop) {
    r = Math.min(r, w / 2, h);
    if (roundTop) {
      return (
        "M" + x + "," + (y + h) +
        " L" + x + "," + (y + r) +
        " Q" + x + "," + y + " " + (x + r) + "," + y +
        " L" + (x + w - r) + "," + y +
        " Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
        " L" + (x + w) + "," + (y + h) + " Z"
      );
    }
    return (
      "M" + x + "," + y +
      " L" + (x + w) + "," + y +
      " L" + (x + w) + "," + (y + h - r) +
      " Q" + (x + w) + "," + (y + h) + " " + (x + w - r) + "," + (y + h) +
      " L" + (x + r) + "," + (y + h) +
      " Q" + x + "," + (y + h) + " " + x + "," + (y + h - r) +
      " Z"
    );
  }

  function textEl(attrs, content) {
    var t = document.createElementNS(SVGNS, "text");
    t.setAttribute("font-family", FONT_FAMILY);
    for (var key in attrs) t.setAttribute(key, attrs[key]);
    if (content != null) t.textContent = content;
    return t;
  }

  function attachTooltip(node, tooltipEl, chartWrapEl, info) {
    function show() {
      var rectBox = chartWrapEl.getBoundingClientRect();
      var nodeBox = node.getBoundingClientRect();
      tooltipEl.innerHTML = "";

      var key = document.createElement("span");
      key.className = "tt-key";
      key.style.background = info.color;
      tooltipEl.appendChild(key);

      var metaEl = document.createElement("span");
      metaEl.className = "tt-meta";
      metaEl.appendChild(document.createTextNode(info.embedding + " · " + info.familyLabel));
      tooltipEl.appendChild(metaEl);
      tooltipEl.appendChild(document.createElement("br"));

      var val = document.createElement("span");
      val.className = "tt-value";
      val.textContent = formatValue(info.value);
      tooltipEl.appendChild(val);

      var n = document.createElement("span");
      n.className = "tt-meta";
      n.textContent = " (n=" + info.n + ")";
      tooltipEl.appendChild(n);

      tooltipEl.style.left = nodeBox.left - rectBox.left + nodeBox.width / 2 + "px";
      tooltipEl.style.top = nodeBox.top - rectBox.top + "px";
      tooltipEl.classList.add("visible");
    }
    function hide() {
      tooltipEl.classList.remove("visible");
    }
    node.addEventListener("pointerenter", show);
    node.addEventListener("pointermove", show);
    node.addEventListener("pointerleave", hide);
    node.addEventListener("focus", show);
    node.addEventListener("blur", hide);
  }

  /**
   * Draws the grouped bar chart into `svg`.
   * opts: { ranked, meta, families, activeFamilies, familyLabel, theme,
   *         chartWrap, tooltip }
   */
  function renderBarChart(svg, opts) {
    var ranked = opts.ranked;
    var meta = opts.meta;
    var theme = opts.theme;
    var familyLabel = opts.familyLabel;
    var visibleFamilies = opts.families.filter(function (f) {
      return opts.activeFamilies[f];
    });

    svg.innerHTML = "";
    if (!ranked.length || !visibleFamilies.length) return;

    var width = Math.max(opts.chartWrap.clientWidth, 320);
    var marginTop = 28, marginRight = 16, marginBottom = 96, marginLeft = 52;
    var barBand = visibleFamilies.length;
    var groupGap = 22;
    var groupWidth = Math.max(40, Math.min(140, (width - marginLeft - marginRight) / ranked.length - groupGap));
    var innerWidth = ranked.length * (groupWidth + groupGap);
    width = Math.max(width, innerWidth + marginLeft + marginRight);
    var height = 380;
    var plotH = height - marginTop - marginBottom;

    var allValues = [];
    ranked.forEach(function (e) {
      visibleFamilies.forEach(function (f) {
        if (e.families[f]) allValues.push(e.families[f].value);
      });
    });
    var dataMin = Math.min.apply(null, allValues.concat([0]));
    var dataMax = Math.max.apply(null, allValues.concat([0]));
    var pad = (dataMax - dataMin) * 0.12 || 1;
    var yMax = dataMax + pad;
    var yMin = dataMin - (dataMin < 0 ? pad : 0);
    var yScale = function (v) {
      return marginTop + plotH * (1 - (v - yMin) / (yMax - yMin));
    };
    var baselineY = yScale(0);

    svg.setAttribute("viewBox", "0 0 " + width + " " + height);

    // background — needed so an exported standalone SVG/PNG has a surface
    // rather than a transparent hole where the page used to show through.
    var bg = document.createElementNS(SVGNS, "rect");
    bg.setAttribute("x", 0);
    bg.setAttribute("y", 0);
    bg.setAttribute("width", width);
    bg.setAttribute("height", height);
    bg.setAttribute("fill", theme.surface);
    svg.appendChild(bg);

    // gridlines + y ticks
    var ticks = 5;
    for (var t = 0; t <= ticks; t++) {
      var v = yMin + (t / ticks) * (yMax - yMin);
      var y = yScale(v);
      var line = document.createElementNS(SVGNS, "line");
      line.setAttribute("x1", marginLeft);
      line.setAttribute("x2", width - marginRight);
      line.setAttribute("y1", y);
      line.setAttribute("y2", y);
      line.setAttribute("stroke", theme.gridline);
      line.setAttribute("stroke-width", "1");
      svg.appendChild(line);

      svg.appendChild(
        textEl(
          { x: marginLeft - 8, y: y + 3.5, "text-anchor": "end", "font-size": "11", fill: theme.textMuted },
          formatValue(v)
        )
      );
    }

    // baseline
    var base = document.createElementNS(SVGNS, "line");
    base.setAttribute("x1", marginLeft);
    base.setAttribute("x2", width - marginRight);
    base.setAttribute("y1", baselineY);
    base.setAttribute("y2", baselineY);
    base.setAttribute("stroke", theme.baseline);
    base.setAttribute("stroke-width", "1");
    svg.appendChild(base);

    var barWidth = Math.min(24, (groupWidth - (barBand - 1) * 2) / barBand);

    ranked.forEach(function (entry, i) {
      var groupX = marginLeft + i * (groupWidth + groupGap);
      var usedWidth = barWidth * visibleFamilies.length + 2 * (visibleFamilies.length - 1);
      var startX = groupX + (groupWidth - usedWidth) / 2;

      visibleFamilies.forEach(function (family, j) {
        var rec = entry.families[family];
        if (!rec) return;
        var x = startX + j * (barWidth + 2);
        var y0 = yScale(0), y1 = yScale(rec.value);
        var top = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0));
        var radius = Math.min(4, h);

        var bar = document.createElementNS(SVGNS, "path");
        bar.setAttribute("d", roundedBarPath(x, top, barWidth, h, radius, rec.value >= 0));
        bar.setAttribute("class", "bar");
        bar.setAttribute("fill", theme.families[family]);
        bar.setAttribute("tabindex", "0");
        bar.setAttribute("role", "img");
        bar.setAttribute("aria-label", entry.embedding + ", " + familyLabel[family] + ": " + formatValue(rec.value));
        svg.appendChild(bar);

        attachTooltip(bar, opts.tooltip, opts.chartWrap, {
          embedding: entry.embedding,
          familyLabel: familyLabel[family],
          color: theme.families[family],
          value: rec.value,
          n: rec.n,
        });
      });

      // direct label on the leading (best-ranked) group only — see
      // marks-and-anatomy: label selectively, never every bar.
      if (i === 0) {
        var bestFamily = visibleFamilies
          .filter(function (f) {
            return entry.families[f];
          })
          .sort(function (a, b) {
            return meta.higher_is_better
              ? entry.families[b].value - entry.families[a].value
              : entry.families[a].value - entry.families[b].value;
          })[0];
        if (bestFamily) {
          var rec2 = entry.families[bestFamily];
          var lx = startX + visibleFamilies.indexOf(bestFamily) * (barWidth + 2) + barWidth / 2;
          var ly = yScale(rec2.value) + (rec2.value >= 0 ? -6 : 14);
          svg.appendChild(
            textEl(
              { x: lx, y: ly, "text-anchor": "middle", "font-size": "11", "font-weight": "700", fill: theme.textPrimary },
              formatValue(rec2.value)
            )
          );
        }
      }

      var lx2 = groupX + groupWidth / 2;
      var ly2 = height - marginBottom + 14;
      svg.appendChild(
        textEl(
          {
            x: lx2, y: ly2, "text-anchor": "end", "font-size": "11", fill: theme.textMuted,
            transform: "rotate(-38 " + lx2 + " " + ly2 + ")",
          },
          entry.embedding
        )
      );
    });
  }

  // ---- table view --------------------------------------------------------

  function renderTable(container, opts) {
    var ranked = opts.ranked;
    var meta = opts.meta;
    var families = opts.families;
    var familyLabel = opts.familyLabel;
    var metricLabel = opts.metricLabel;

    container.innerHTML = "";
    if (!ranked.length) return;

    var table = document.createElement("table");
    table.className = "leaderboard-table";

    var caption = document.createElement("caption");
    caption.textContent = "Full ranked values — " + metricLabel + ", test split.";
    table.appendChild(caption);

    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    ["Rank", "Embedding model"]
      .concat(families.map(function (f) { return familyLabel[f] || f; }))
      .forEach(function (h) {
        var th = document.createElement("th");
        th.textContent = h;
        headRow.appendChild(th);
      });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    ranked.forEach(function (entry, i) {
      var row = document.createElement("tr");
      var rank = document.createElement("td");
      rank.textContent = String(i + 1);
      row.appendChild(rank);

      var name = document.createElement("td");
      name.textContent = entry.embedding;
      row.appendChild(name);

      families.forEach(function (f) {
        var td = document.createElement("td");
        td.textContent = entry.families[f] ? formatValue(entry.families[f].value) : "—";
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    container.appendChild(table);
  }

  // ---- export --------------------------------------------------------------
  //
  // Because renderBarChart already bakes concrete colors/fonts into every
  // element (see resolveTheme above), serializing the live <svg> node is
  // enough to get a standalone file — no separate "inline the computed
  // styles" pass is needed at export time.

  function svgMarkup(svgEl) {
    var clone = svgEl.cloneNode(true);
    clone.setAttribute("xmlns", SVGNS);
    var vb = svgEl.viewBox.baseVal;
    var w = (vb && vb.width) || svgEl.clientWidth;
    var h = (vb && vb.height) || svgEl.clientHeight;
    clone.setAttribute("width", w);
    clone.setAttribute("height", h);
    return { markup: new XMLSerializer().serializeToString(clone), width: w, height: h };
  }

  function triggerDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  function downloadSvg(svgEl, filename) {
    var out = svgMarkup(svgEl);
    triggerDownload(new Blob([out.markup], { type: "image/svg+xml;charset=utf-8" }), filename);
  }

  function downloadPng(svgEl, filename, scale) {
    scale = scale || 2;
    var out = svgMarkup(svgEl);
    var url = URL.createObjectURL(new Blob([out.markup], { type: "image/svg+xml;charset=utf-8" }));
    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement("canvas");
      canvas.width = out.width * scale;
      canvas.height = out.height * scale;
      var ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0, out.width, out.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (pngBlob) {
        triggerDownload(pngBlob, filename);
      }, "image/png");
    };
    img.src = url;
  }

  global.LeaderboardCharts = {
    resolveTheme: resolveTheme,
    formatValue: formatValue,
    renderLegend: renderLegend,
    renderBarChart: renderBarChart,
    renderTable: renderTable,
    downloadSvg: downloadSvg,
    downloadPng: downloadPng,
  };
})(window);

</script>
<script>
/**
 * LeaderboardApp — owns the page's state (filters, active families, theme,
 * current view) and wires the DOM controls to LeaderboardCharts' stateless
 * renderers. Call LeaderboardApp.init(DATA) once the page and the data
 * payload are both ready.
 */
(function (global) {
  "use strict";

  var FAMILY_LABEL = { linear: "Linear", mlp: "MLP", xgboost: "XGBoost" };
  var SPLIT_LABEL = { random: "Random split", loco: "Similarity-clustered (LOCO)" };
  var MODE_LABEL = { no_attention: "Mean-pooled", attention: "Attention-pooled" };
  var METRIC_LABEL = {
    mae: "MAE", rmse: "RMSE", r2: "R²", kendall_tau: "Kendall's τ",
    accuracy: "Accuracy", precision: "Precision", recall: "Recall", f1: "F1",
  };
  var SPLIT_ORDER = ["random", "loco"];
  var MODE_ORDER = ["no_attention", "attention"];

  function init(DATA) {
    var Charts = global.LeaderboardCharts;

    var els = {
      root: document.documentElement,
      vizRoot: document.querySelector(".viz-root"),
      taskSelect: document.getElementById("task-select"),
      splitSelect: document.getElementById("split-select"),
      modeSelect: document.getElementById("mode-select"),
      chartTitle: document.getElementById("chart-title"),
      chartSubtitle: document.getElementById("chart-subtitle"),
      chartNotes: document.getElementById("chart-notes"),
      legend: document.getElementById("legend"),
      svg: document.getElementById("chart"),
      tooltip: document.getElementById("tooltip"),
      chartWrap: document.getElementById("chart-wrap"),
      emptyState: document.getElementById("empty-state"),
      tableWrap: document.getElementById("table-wrap"),
      viewChartBtn: document.getElementById("view-chart"),
      viewTableBtn: document.getElementById("view-table"),
      themeToggle: document.getElementById("theme-toggle"),
      exportSvgBtn: document.getElementById("export-svg"),
      exportPngBtn: document.getElementById("export-png"),
    };

    var state = {
      activeFamilies: {},
      view: "chart",
    };
    DATA.model_families.forEach(function (f) {
      state.activeFamilies[f] = true;
    });

    // ---- controls -----------------------------------------------------------

    function populateTaskSelect() {
      var groups = { properties: "Benchmark properties", real_case: "Real-case" };
      var optgroups = {};
      DATA.task_order.forEach(function (task) {
        var meta = DATA.tasks[task];
        var groupKey = groups[meta.scope] ? meta.scope : "properties";
        if (!optgroups[groupKey]) {
          var og = document.createElement("optgroup");
          og.label = groups[groupKey];
          els.taskSelect.appendChild(og);
          optgroups[groupKey] = og;
        }
        var opt = document.createElement("option");
        opt.value = task;
        opt.textContent = task;
        optgroups[groupKey].appendChild(opt);
      });
    }

    function availableCombosForTask(task) {
      var combos = {};
      DATA.records.forEach(function (r) {
        if (r.task !== task) return;
        combos[r.split + "|" + r.mode] = { split: r.split, mode: r.mode };
      });
      return combos;
    }

    function uniquePreferring(arr, preferredOrder) {
      var seen = {};
      var out = [];
      arr.forEach(function (v) {
        if (!seen[v]) {
          seen[v] = true;
          out.push(v);
        }
      });
      out.sort(function (a, b) {
        var ia = preferredOrder.indexOf(a), ib = preferredOrder.indexOf(b);
        if (ia === -1) ia = preferredOrder.length;
        if (ib === -1) ib = preferredOrder.length;
        return ia !== ib ? ia - ib : a.localeCompare(b);
      });
      return out;
    }

    function fillSelect(select, values, labelMap) {
      var prior = select.value;
      select.innerHTML = "";
      values.forEach(function (v) {
        var opt = document.createElement("option");
        opt.value = v;
        opt.textContent = labelMap[v] || v;
        select.appendChild(opt);
      });
      if (values.indexOf(prior) !== -1) select.value = prior;
    }

    function populateSplitAndMode() {
      var combos = availableCombosForTask(els.taskSelect.value);
      var splits = uniquePreferring(Object.keys(combos).map(function (k) { return combos[k].split; }), SPLIT_ORDER);
      var modes = uniquePreferring(Object.keys(combos).map(function (k) { return combos[k].mode; }), MODE_ORDER);
      fillSelect(els.splitSelect, splits, SPLIT_LABEL);
      fillSelect(els.modeSelect, modes, MODE_LABEL);
    }

    // ---- data shaping ---------------------------------------------------------

    function currentRows() {
      var task = els.taskSelect.value, split = els.splitSelect.value, mode = els.modeSelect.value;
      return DATA.records.filter(function (r) {
        return r.task === task && r.split === split && r.mode === mode;
      });
    }

    function groupByEmbedding(rows) {
      var byEmbedding = {};
      rows.forEach(function (r) {
        if (!byEmbedding[r.embedding]) byEmbedding[r.embedding] = {};
        byEmbedding[r.embedding][r.family] = r;
      });
      return byEmbedding;
    }

    function rankedEmbeddings(byEmbedding, higherIsBetter) {
      var entries = Object.keys(byEmbedding).map(function (emb) {
        var families = byEmbedding[emb];
        var vals = DATA.model_families
          .filter(function (f) { return families[f]; })
          .map(function (f) { return families[f].value; });
        var mean = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
        return { embedding: emb, families: families, rankValue: mean };
      });
      entries.sort(function (a, b) {
        return higherIsBetter ? b.rankValue - a.rankValue : a.rankValue - b.rankValue;
      });
      return entries;
    }

    // ---- rendering --------------------------------------------------------

    function exportFilename(ext) {
      var safe = function (s) { return String(s).replace(/[^a-z0-9]+/gi, "-"); };
      return [
        "leaderboard", safe(els.taskSelect.value), safe(els.splitSelect.value), safe(els.modeSelect.value),
      ].join("-") + "." + ext;
    }

    function render() {
      var task = els.taskSelect.value;
      if (!task) return;
      var meta = DATA.tasks[task];
      var byEmbedding = groupByEmbedding(currentRows());
      var ranked = rankedEmbeddings(byEmbedding, meta.higher_is_better);
      var theme = Charts.resolveTheme(els.vizRoot);

      els.chartTitle.textContent = task;
      els.chartSubtitle.textContent =
        METRIC_LABEL[meta.metric] + " on the test split · " +
        (meta.higher_is_better ? "higher is better" : "lower is better") +
        " · " + meta.task_type;
      els.chartNotes.textContent = ranked.length
        ? "Ranked by mean " + METRIC_LABEL[meta.metric] + " across the model families that completed for each embedding."
        : "";

      Charts.renderLegend(els.legend, {
        families: DATA.model_families,
        activeFamilies: state.activeFamilies,
        familyLabel: FAMILY_LABEL,
        theme: theme,
        onToggle: function (family) {
          state.activeFamilies[family] = !state.activeFamilies[family];
          render();
        },
      });

      els.emptyState.hidden = ranked.length > 0;
      els.svg.style.display = ranked.length ? "block" : "none";
      var hasData = ranked.length > 0;
      els.exportSvgBtn.disabled = !hasData;
      els.exportPngBtn.disabled = !hasData;

      if (state.view === "chart") {
        Charts.renderBarChart(els.svg, {
          ranked: ranked, meta: meta, families: DATA.model_families,
          activeFamilies: state.activeFamilies, familyLabel: FAMILY_LABEL,
          theme: theme, chartWrap: els.chartWrap, tooltip: els.tooltip,
        });
      } else {
        Charts.renderTable(els.tableWrap, {
          ranked: ranked, meta: meta, families: DATA.model_families,
          familyLabel: FAMILY_LABEL, metricLabel: METRIC_LABEL[meta.metric],
        });
      }
    }

    // ---- wiring -------------------------------------------------------------

    function setView(view) {
      state.view = view;
      els.viewChartBtn.setAttribute("aria-pressed", String(view === "chart"));
      els.viewTableBtn.setAttribute("aria-pressed", String(view === "table"));
      els.chartWrap.hidden = view !== "chart";
      els.tableWrap.hidden = view !== "table";
      render();
    }

    els.viewChartBtn.addEventListener("click", function () { setView("chart"); });
    els.viewTableBtn.addEventListener("click", function () { setView("table"); });

    els.taskSelect.addEventListener("change", function () { populateSplitAndMode(); render(); });
    els.splitSelect.addEventListener("change", render);
    els.modeSelect.addEventListener("change", render);
    window.addEventListener("resize", function () {
      if (state.view === "chart") render();
    });

    els.themeToggle.addEventListener("click", function () {
      var isDark = els.root.getAttribute("data-theme") === "dark";
      els.root.setAttribute("data-theme", isDark ? "light" : "dark");
      els.themeToggle.setAttribute("aria-pressed", String(!isDark));
      render();
    });

    els.exportSvgBtn.addEventListener("click", function () {
      Charts.downloadSvg(els.svg, exportFilename("svg"));
    });
    els.exportPngBtn.addEventListener("click", function () {
      Charts.downloadPng(els.svg, exportFilename("png"));
    });

    populateTaskSelect();
    populateSplitAndMode();
    render();
  }

  global.LeaderboardApp = { init: init };
})(window);

</script>
<script>
  LeaderboardApp.init(JSON.parse(document.getElementById("leaderboard-data").textContent));
</script>
</body>
</html>
