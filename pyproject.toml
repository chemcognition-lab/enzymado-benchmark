[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enzymado"
version = "0.0.1"
description = "Enzymado: protein function benchmark across embedding models and properties."
authors = [
  { name = "chemcognition-lab" },
]
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ipython",
    "jaxtyping",
    "jupyterlab",
    "matplotlib",
    "seaborn",
    "umap-learn",
    "notebook",
    "numpy",
    "scipy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "safetensors",
    "tqdm",
    "more-itertools",
]
requires-python = ">=3.12,<3.14"

[project.optional-dependencies]
# Cluster jobs currently use both Python 3.12 and 3.13 modules. Keep torch in
# the extras so `uv sync --extra ...` creates runnable environments directly.
train = [
    "h5py",
    "joblib",
    "xgboost",
    "rdkit",
    "descriptastorus",
    "requests",
    "biopython",
    "torch==2.7.0",
    "torchinfo",
]
embeddings = [
    "h5py",
    "transformers",
    "sentencepiece",
    "biopython",
    "accelerate",
    "fair-esm",
    "esm",
    "ankh",
    "torch==2.7.0",
]
profluent = [
    "e1",
    "flash-attn",
    "torch==2.7.0",
]
# Assistant over the results (src/enzymado/llm): card templates, the Gemini SDK
# and the Streamlit chatbot. Card generation needs only jinja2.
llm = [
    "google-genai",
    "jinja2",
    "streamlit",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["enzymado*"]

[tool.ruff]
line-length = 88
src = ["src"]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "src/models/**/*.py",
    "scripts/**/*.py",
    "embedding_scripts/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
extend-select = [
  "I", # Add import sorting
  "N",   # enforce naming conventions, e.g. ClassName vs function_name
  "FBT", # detect boolean traps
  "BLE", # disallow catch-all exceptions
  "E501", # enforce the 88-character limit declared above
]
# jaxtyping writes shapes as string annotations ("*batch dim"), which Ruff reads
# as malformed forward references. Ignoring F722 is jaxtyping's documented setup.
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"embedding_scripts/prost5_embedding_script.py" = ["N802", "N803", "N806"]
"embedding_scripts/prot5_embedding_script.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = [
    "enzymado",
    "src",
    "models",
    "training",
    "data_loading",
    "evaluation",
    "dataset_card",
]
force-sort-within-sections = true
