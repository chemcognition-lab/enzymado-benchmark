[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "enzymado"
version = "0.0.1"
description = "Enzymado: protein function benchmark across embedding models and properties."
authors = [
  { name = "chemcognition-lab" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipython",
    "jupyterlab",
    "matplotlib",
    "seaborn",
    "notebook",
    "numpy",
    "scipy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "more-itertools",
]
requires-python = ">=3.12,<3.14"

[project.optional-dependencies]
# Cluster jobs currently use both Python 3.12 and 3.13 modules. Keep torch in
# the extras so `uv sync --extra ...` creates runnable environments directly.
train = [
    "h5py",
    "joblib",
    "xgboost",
    "rdkit",
    "requests",
    "biopython",
    "safetensors",
    "torch==2.7.0",
]
embeddings = [
    "h5py",
    "transformers",
    "sentencepiece",
    "biopython",
    "accelerate",
    "fair-esm",
    "esm",
    "ankh",
    "safetensors",
    "torch==2.7.0",
]
profluent = [
    "e1",
    "flash-attn",
    "torch==2.7.0",
]
viz = [
    "streamlit",
    "plotly",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.ruff]
line-length = 99
src = ["src"]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "src/models/**/*.py",
    "scripts/**/*.py",
    "embedding_scripts/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
extend-select = [
  "I", # Add import sorting
  "N",   # enforce naming conventions, e.g. ClassName vs function_name
  "FBT", # detect boolean traps
  "BLE", # disallow catch-all exceptions
]

[tool.ruff.lint.isort]
known-first-party = [
    "src",
    "models",
    "training",
    "data_loading",
    "evaluation",
    "dataset_card",
]
force-sort-within-sections = true
